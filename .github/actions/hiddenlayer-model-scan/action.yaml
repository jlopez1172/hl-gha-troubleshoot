name: 'Model Scanner Self Hosted'
description: 'Scans models for vulnerabilities using the HiddenLayer Model Scanner Self Hosted CLI'
branding:
  icon: lock
  color: green
inputs:
  model_path:
    description: 'Path to the model, either a file or a folder. Mutually exclusive with model_url.'
    required: false
    default: ''
  model_url:
    description: 'URL to the model (e.g. https://huggingface.co/<org>/<repo>). Mutually exclusive with model_path.'
    required: false
    default: ''
  fail_on_detection:
    description: Fails pipeline if a malicious model is detected.
    required: false
    default: 'true'
  output_file:
    description: Writes detection output to a json file.
    required: false
    default: ''
  sarif_file:
    description: 'Writes SARIF output. WARNING: currently requires a second full scan of the model unless skip_sarif_rescan is false and you accept 2x download cost.'
    required: false
    default: ''
  skip_sarif_rescan:
    description: 'If true (default), do not re-download/re-scan just to produce SARIF. Set false only for small models when you need SARIF from a second pass.'
    required: false
    default: 'true'
  run_id:
    description: Run ID
    required: false
    default: ''
  upload_to_hiddenlayer:
    description: 'Uploads the report to HiddenLayer (requires HL_CLIENT_ID, HL_CLIENT_SECRET, auth + results URLs)'
    required: false
    default: 'true'
  upload_to_github_security:
    description: 'Uploads the SARIF file to GitHub Security (requires a SARIF file from a prior scan pass)'
    required: false
    default: 'false'
  container_registry:
    description: 'Container registry to authenticate against for pulling the scanner image'
    required: false
    default: 'images.hiddenlayer.ai'
  local_scanner_image:
    description: 'Perform scans using a local scanner container image'
    required: false
    default: 'images.hiddenlayer.ai/proxy/aisec-platform/ghcr.io/hiddenlayer-engineering/modelscanner-src'
  local_scanner_version:
    description: 'Version of the local scanner container image'
    required: false
    default: '26.7.0'
  model_name:
    description: 'Name of the model'
    required: false
    default: ''
  model_version:
    description: 'Version of the model'
    required: false
    default: ''
  enable_stream_scanning:
    description: 'Set HL_STREAM_SCANNING=true (experimental; scans remote streams without a full local materialization first)'
    required: false
    default: 'false'
  scan_timeout_seconds:
    description: 'HL_SCAN_TIMEOUT_SECONDS passed into the scanner container (default 86400 = 24h)'
    required: false
    default: '86400'
outputs:
  detection_results:
    description: 'Markdown table of detection results.'
runs:
  using: 'composite'
  steps:
    - name: Login to container registry
      shell: bash
      run: docker login --username="$HL_CONTAINER_REGISTRY_USER" --password="$HL_CONTAINER_REGISTRY_SECRET" "${{ inputs.container_registry }}"

    - name: Validate model source
      shell: bash
      run: |
        if [ -z "${{ inputs.model_path }}" ] && [ -z "${{ inputs.model_url }}" ]; then
          echo "::error::Either model_path or model_url must be provided"
          exit 1
        fi
        if [ -n "${{ inputs.model_path }}" ] && [ -n "${{ inputs.model_url }}" ]; then
          echo "::error::model_path and model_url are mutually exclusive"
          exit 1
        fi

    - name: Resolve platform endpoints for persist
      shell: bash
      run: |
        # modelscanner-src reads these names (defaults are localhost stubs):
        #   HL_MODEL_SCANNER_TOKEN_URL
        #   HL_MODEL_SCANNER_PLATFORM_RESULTS_URL
        TOKEN_URL="${HL_MODEL_SCANNER_TOKEN_URL:-${HIDDENLAYER_AUTH_URL:-}}"
        RESULTS_URL="${HL_MODEL_SCANNER_PLATFORM_RESULTS_URL:-${HIDDENLAYER_BASE_URL:-}}"

        echo "HL_MODEL_SCANNER_TOKEN_URL=${TOKEN_URL}" >> "$GITHUB_ENV"
        echo "HL_MODEL_SCANNER_PLATFORM_RESULTS_URL=${RESULTS_URL}" >> "$GITHUB_ENV"
        echo "HL_SCAN_TIMEOUT_SECONDS=${{ inputs.scan_timeout_seconds }}" >> "$GITHUB_ENV"
        echo "HL_STREAM_SCANNING=${{ inputs.enable_stream_scanning }}" >> "$GITHUB_ENV"

        if [ "${{ inputs.upload_to_hiddenlayer }}" = "true" ]; then
          missing=0
          if [ -z "${HL_CLIENT_ID:-}" ] || [ -z "${HL_CLIENT_SECRET:-}" ]; then
            echo "::error::upload_to_hiddenlayer=true requires HL_CLIENT_ID and HL_CLIENT_SECRET"
            missing=1
          fi
          if [ -z "${TOKEN_URL}" ] || [[ "${TOKEN_URL}" == *"127.0.0.1"* ]]; then
            echo "::error::upload_to_hiddenlayer=true requires a real auth URL via HIDDENLAYER_AUTH_URL or HL_MODEL_SCANNER_TOKEN_URL (got '${TOKEN_URL:-<empty>}')"
            missing=1
          fi
          if [ -z "${RESULTS_URL}" ] || [[ "${RESULTS_URL}" == *"127.0.0.1"* ]]; then
            echo "::error::upload_to_hiddenlayer=true requires a real results URL via HIDDENLAYER_BASE_URL or HL_MODEL_SCANNER_PLATFORM_RESULTS_URL (got '${RESULTS_URL:-<empty>}')"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Persist enabled → auth=${TOKEN_URL} results=${RESULTS_URL}"
        fi

        if [ -n "${{ inputs.model_url }}" ] && [ -z "${HF_TOKEN:-}" ]; then
          echo "::warning::HF_TOKEN is empty. Large Hugging Face downloads are often rate-limited anonymously; set secrets.HF_TOKEN for reliable large-model scans."
        fi

    - name: Calculate CLI Parameters
      shell: bash
      id: calculate_cli_parameters
      run: |
        if [ -n "${{ inputs.model_name }}" ]; then
          echo "MODEL_NAME=--model-name=${{ inputs.model_name }}" >> "$GITHUB_ENV"
        else
          echo "MODEL_NAME=" >> "$GITHUB_ENV"
        fi
        if [ -n "${{ inputs.model_version }}" ]; then
          echo "MODEL_VERSION=--model-version=${{ inputs.model_version }}" >> "$GITHUB_ENV"
        else
          echo "MODEL_VERSION=" >> "$GITHUB_ENV"
        fi
        echo "SARIF_FILE=${{ runner.temp }}/result.sarif" >> "$GITHUB_ENV"
        echo "OUTPUT_FILE=${{ runner.temp }}/result.json" >> "$GITHUB_ENV"
        touch "${{ runner.temp }}/result.sarif"
        touch "${{ runner.temp }}/result.json"
        chmod ugo+rw "${{ runner.temp }}/result.sarif"
        chmod ugo+rw "${{ runner.temp }}/result.json"

    - name: Prefetch scanner image
      shell: bash
      run: |
        # images.hiddenlayer.ai token/manifest fetches occasionally time out from GHA;
        # retry instead of failing the whole large-model job on a transient registry blip.
        echo "Pulling $SCANNER_IMAGE:$SCANNER_VERSION"
        attempts=5
        delay=15
        for i in $(seq 1 "$attempts"); do
          if docker pull "$SCANNER_IMAGE:$SCANNER_VERSION"; then
            echo "Image pull succeeded on attempt $i"
            df -h /
            exit 0
          fi
          echo "::warning::docker pull failed (attempt $i/$attempts); retrying in ${delay}s..."
          sleep "$delay"
          delay=$((delay * 2))
        done
        echo "::error::Failed to pull $SCANNER_IMAGE:$SCANNER_VERSION after $attempts attempts (registry timeout/connectivity)."
        exit 1
      env:
        SCANNER_IMAGE: ${{ inputs.local_scanner_image }}
        SCANNER_VERSION: ${{ inputs.local_scanner_version }}

    - name: Scan Models
      id: scan_models
      shell: bash
      run: |
        set -x
        if [ -n "$MODEL_URL" ]; then
          docker run --rm \
            -e HL_LICENSE \
            -e HL_CLIENT_ID \
            -e HL_CLIENT_SECRET \
            -e HL_MODEL_SCANNER_TOKEN_URL \
            -e HL_MODEL_SCANNER_PLATFORM_RESULTS_URL \
            -e HL_SCAN_TIMEOUT_SECONDS \
            -e HL_STREAM_SCANNING \
            -e HF_TOKEN \
            -e HUGGINGFACE_TOKEN \
            -v "${{ runner.temp }}:/results:Z" \
            "$SCANNER_IMAGE:$SCANNER_VERSION" \
            --input "$MODEL_URL" \
            --output=/results/result.json \
            --log-file=/results/scanner.log \
            $UPLOAD_TO_HIDDENLAYER $MODEL_NAME $MODEL_VERSION
        else
          docker run --rm \
            -e HL_LICENSE \
            -e HL_CLIENT_ID \
            -e HL_CLIENT_SECRET \
            -e HL_MODEL_SCANNER_TOKEN_URL \
            -e HL_MODEL_SCANNER_PLATFORM_RESULTS_URL \
            -e HL_SCAN_TIMEOUT_SECONDS \
            -e HL_STREAM_SCANNING \
            -v "$MODEL_PATH:/files-to-scan" \
            -v "${{ runner.temp }}:/results:Z" \
            "$SCANNER_IMAGE:$SCANNER_VERSION" \
            --input /files-to-scan \
            --output=/results/result.json \
            --log-file=/results/scanner.log \
            $UPLOAD_TO_HIDDENLAYER $MODEL_NAME $MODEL_VERSION
        fi
        echo "== disk after scan =="
        df -h /
        if [ -f "${{ runner.temp }}/scanner.log" ]; then
          echo "== scanner.log (tail) =="
          tail -n 80 "${{ runner.temp }}/scanner.log" || true
        fi
      env:
        UPLOAD_TO_HIDDENLAYER: ${{ inputs.upload_to_hiddenlayer == 'true' && '--persist' || '' }}
        SCANNER_IMAGE: ${{ inputs.local_scanner_image }}
        SCANNER_VERSION: ${{ inputs.local_scanner_version }}
        MODEL_PATH: ${{ inputs.model_path }}
        MODEL_URL: ${{ inputs.model_url }}

    - name: Scan Models (Sarif)
      id: scan_models_sarif
      # Second full download+scan — avoid for large models.
      if: ${{ (inputs.sarif_file != '' || inputs.upload_to_github_security == 'true') && inputs.skip_sarif_rescan != 'true' }}
      shell: bash
      run: |
        if [ -n "$MODEL_URL" ]; then
          docker run --rm \
            -e HL_LICENSE \
            -e HL_SCAN_TIMEOUT_SECONDS \
            -e HL_STREAM_SCANNING \
            -e HF_TOKEN \
            -e HUGGINGFACE_TOKEN \
            -v "${{ runner.temp }}:/results:Z" \
            "$SCANNER_IMAGE:$SCANNER_VERSION" \
            --input "$MODEL_URL" \
            --output-format=sarif \
            --output=/results/result.sarif
        else
          docker run --rm \
            -e HL_LICENSE \
            -e HL_SCAN_TIMEOUT_SECONDS \
            -e HL_STREAM_SCANNING \
            -v "$MODEL_PATH:/files-to-scan" \
            -v "${{ runner.temp }}:/results:Z" \
            "$SCANNER_IMAGE:$SCANNER_VERSION" \
            --input /files-to-scan \
            --output-format=sarif \
            --output=/results/result.sarif
        fi
      env:
        SCANNER_IMAGE: ${{ inputs.local_scanner_image }}
        SCANNER_VERSION: ${{ inputs.local_scanner_version }}
        MODEL_PATH: ${{ inputs.model_path }}
        MODEL_URL: ${{ inputs.model_url }}

    - name: Note skipped SARIF rescan
      if: ${{ (inputs.sarif_file != '' || inputs.upload_to_github_security == 'true') && inputs.skip_sarif_rescan == 'true' }}
      shell: bash
      run: |
        echo "::notice::SARIF rescan skipped (skip_sarif_rescan=true). JSON results were produced in a single pass; a second scan would re-download the full model."

    - name: Upload to Github Security
      if: ${{ inputs.upload_to_github_security == 'true' && inputs.skip_sarif_rescan != 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/result.sarif

    - name: Show Scan summary (JSON)
      shell: bash
      run: |
        if [ ! -s "$OUTPUT_FILE" ]; then
          echo "::warning::No scan results written to $OUTPUT_FILE"
          exit 0
        fi
        # Avoid dumping multi-MB JSON into GHA logs on large models
        jq '{
          detection_count,
          scan_id: (.scan_id // "-"),
          model: (.model // "-"),
          file_count: ((.file_results // []) | length)
        }' "$OUTPUT_FILE" || head -c 4000 "$OUTPUT_FILE"

    - name: Copy Results
      shell: bash
      if: ${{ inputs.output_file != '' || (inputs.sarif_file != '' && inputs.skip_sarif_rescan != 'true') }}
      run: |
        if [ -n "${{ inputs.output_file }}" ] && [ -s "$OUTPUT_FILE" ]; then
          cp "$OUTPUT_FILE" "$GITHUB_WORKSPACE/${{ inputs.output_file }}"
        fi
        if [ -n "${{ inputs.sarif_file }}" ] && [ "${{ inputs.skip_sarif_rescan }}" != "true" ] && [ -s "$SARIF_FILE" ]; then
          cp "$SARIF_FILE" "$GITHUB_WORKSPACE/${{ inputs.sarif_file }}"
        fi
        if [ -f "${{ runner.temp }}/scanner.log" ]; then
          cp "${{ runner.temp }}/scanner.log" "$GITHUB_WORKSPACE/scanner.log"
        fi

    - name: Fail Job if Detections
      shell: bash
      if: ${{ inputs.fail_on_detection == 'true' }}
      run: |
        detections=$(jq '.detection_count // 0' "$OUTPUT_FILE")
        if [ "$detections" -gt 0 ]; then
          echo "Detections found: $detections. Failing job."
          exit 1
        fi
